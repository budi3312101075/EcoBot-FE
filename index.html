<!doctype html>
<html lang="en" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icons.png" />

    <title>EcoBot AI || IK Engineering</title>

    <script>
      (function () {
        var t = "light";
        try {
          t = localStorage.getItem("ecobot_theme") || "light";
        } catch (e) {}
        var r = document.documentElement;
        r.classList.toggle("dark", t !== "light");
        r.classList.toggle("light", t === "light");
      })();
    </script>
  </head>
  <body
    class="h-full flex text-slate-200 antialiased selection:bg-brand-500/30 selection:text-brand-400"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
